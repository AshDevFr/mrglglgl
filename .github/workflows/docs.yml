name: docs

# Builds the documentation site and uploads it to Cloudflare Pages, which only hosts it. Its
# screenshots are taken fresh on every build from the app's interface in demo mode (made-up data,
# no desktop backend), so they always show the app as it is on main. Pull requests build only.
on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "companion/ui/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - "companion/ui/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            companion/ui/package-lock.json
            docs-site/package-lock.json
      - name: Install the app's interface and the site
        run: |
          npm --prefix companion/ui ci
          npm --prefix docs-site ci
      - name: Install the browser for screenshots
        working-directory: docs-site
        run: npx playwright install --with-deps chromium
      - name: Take the screenshots
        working-directory: docs-site
        run: npm run screenshots
      - name: Build the site
        working-directory: docs-site
        run: npm run build
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshot-failures
          path: docs-site/screenshots/results
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: docs-site
          path: docs-site/dist
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: docs
      url: https://mrglglgl.4sh.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the Cloudflare secrets
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be repository secrets"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: dist
      # A Direct Upload project receives the files; it is created on the first deploy and
      # already exists after that, which is not an error.
      - name: Create the Pages project if it does not exist
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.152.0"
          command: pages project create mrglglgl --production-branch=main
      - name: Upload to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.152.0"
          command: pages deploy dist --project-name=mrglglgl --branch=main --commit-dirty=true
