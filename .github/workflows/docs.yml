name: docs

# Builds the documentation site and publishes it to GitHub Pages. Its screenshots are taken fresh
# on every build from the app's interface in demo mode (made-up data, no desktop backend), so they
# always show the app as it is on main.
on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "companion/ui/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - "companion/ui/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            companion/ui/package-lock.json
            docs-site/package-lock.json
      - name: Install the app's interface and the site
        run: |
          npm --prefix companion/ui ci
          npm --prefix docs-site ci
      - name: Install the browser for screenshots
        working-directory: docs-site
        run: npx playwright install --with-deps chromium
      - name: Take the screenshots
        working-directory: docs-site
        run: npm run screenshots
      - name: Build the site
        working-directory: docs-site
        run: npm run build
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshot-failures
          path: docs-site/screenshots/results
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs-site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
