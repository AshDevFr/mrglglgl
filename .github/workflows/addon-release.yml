name: addon-release

# Packages the addon with the BigWigs packager when an addon tag is pushed. Prerelease tags
# (addon-vX.Y.Z-beta.N) produce a GitHub prerelease only; CurseForge and Wago uploads happen when
# their project IDs are in the TOC and their tokens are set as repository secrets.
on:
  push:
    tags: ["addon-v*"]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: GitHub signs, through Sigstore, that the zip came from this workflow.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "luajit-2.1"
      - uses: leafo/gh-actions-luarocks@v6
      - name: Lint, test and check the package definition
        working-directory: addon
        run: make check package-check LUA=luajit LUA_DIR=
      # The packager's own changelog lists every commit since the previous tag of any kind, the
      # app's included. These notes hold only commits that touch addon/, since the previous addon
      # release: a stable release counts from the previous stable one, so what first shipped in a
      # beta is listed again where players get it. An explicit range, because --include-path
      # drops a tag that sits on a commit outside addon/, and most addon tags do.
      - name: Find the previous addon release
        id: range
        env:
          TAG: ${{ github.ref_name }}
        run: |
          previous=$(git tag -l 'addon-v*' --sort=-v:refname --merged "$TAG^")
          case "${TAG#addon-v}" in
            *-*) ;;
            *) previous=$(grep -vE '^addon-v[0-9.]+-' <<< "$previous" || true) ;;
          esac
          previous=$(head -1 <<< "$previous")
          echo "range=${previous:-$(git rev-list --max-parents=0 "$TAG" | tail -1)}..$TAG" >> "$GITHUB_OUTPUT"
      # .pkgmeta reads it as the manual changelog. A dot file, so the packager leaves it out of
      # the zip.
      - uses: orhun/git-cliff-action@v4
        with:
          config: companion/cliff.toml
          args: --strip header --include-path 'addon/**' --tag ${{ github.ref_name }} ${{ steps.range.outputs.range }}
        env:
          OUTPUT: .release-notes.md
      # Runs from the repository root: .pkgmeta there moves addon/ to the package root.
      - uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      # Anyone can check the zip with `gh attestation verify <zip> --repo <this repo>`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: .release/*.zip
      # The app's updater reads latest.json from the repository's "latest" release, and a new
      # addon release would take that title: give it back to the newest stable app release.
      - name: Keep the newest app release as the latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app=$(gh release list --exclude-pre-releases --limit 50 --json tagName \
            --jq '[.[] | select(.tagName | startswith("companion-v"))][0].tagName')
          if [ -n "$app" ]; then
            gh release edit "$app" --latest
          fi
