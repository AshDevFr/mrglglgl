name: companion-release

# Builds the app's installers for macOS and Windows when an app tag is pushed, and publishes them
# with a changelog of the app's own commits. Builds are unsigned for now; the release notes tell
# players how to open them. Tags with a suffix (companion-vX.Y.Z-beta.N) publish a prerelease.
on:
  push:
    tags: ["companion-v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis
    defaults:
      run:
        shell: bash
        working-directory: companion
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: companion/ui/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion
      - name: Install frontend dependencies
        run: npm --prefix ui ci
      - name: Core tests
        run: cargo test -p mrglglgl-core
      - name: Build unsigned installers
        working-directory: companion/crates/mrglglgl-app
        run: ../../ui/node_modules/.bin/tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            companion/target/release/bundle/dmg/*.dmg
            companion/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      # Only the app's own commits, between app tags.
      - uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: companion/cliff.toml
          args: --latest --strip header --include-path "companion/**" --tag-pattern "companion-v.*"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            cat "${{ steps.changelog.outputs.changelog }}"
            echo
            echo "## Installing"
            echo
            echo "These builds are not signed yet. On macOS, open the app with right-click then Open,"
            echo "or allow it under System Settings > Privacy & Security. On Windows, choose More info"
            echo "then Run anyway in the SmartScreen prompt."
          } > notes.md
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" installers/* --title "Mrglglgl app ${TAG#companion-v}" \
            --notes-file notes.md $prerelease
