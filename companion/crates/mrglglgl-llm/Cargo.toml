[package]
name = "mrglglgl-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Text generation providers for Mrglglgl: bundled local inference and OpenAI-compatible endpoints"
repository.workspace = true

[features]
default = ["local"]
# The bundled local model (llama.cpp, built from source). Off only for builds that never write
# locally.
local = ["dep:llama-cpp-2"]

[dependencies]
async-trait = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

# Default features pull in OpenMP and llama.cpp's `common` library; neither is needed for plain
# CPU generation, and OpenMP needs a separately installed runtime on macOS.
llama-cpp-2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
