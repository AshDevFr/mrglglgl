[package]
name = "mrglglgl-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true

[[bin]]
name = "mrglglgl"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
mrglglgl-core = { workspace = true, features = ["ts"] }
mrglglgl-llm = { workspace = true, features = ["local"] }
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
keyring = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Whether a laptop runs on battery, to hold background writing until it is plugged in.
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }
