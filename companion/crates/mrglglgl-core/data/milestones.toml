# The milestones: cosmetic stamps awarded from the archive. Each is a rule over the facts of one
# day (see `DayFacts` in src/milestones.rs for the facts there are):
#
#   rule = "first_day"  the first day the fact reaches `at_least`
#   rule = "total"      the day the fact, added up day by day, reaches `at_least`
#
# A stamp is stored by `id` and never moves, so an id is never renamed or reused once shipped.
# `name` is the English name prompts and exports use; the window takes names and descriptions
# from the locale catalogues under `milestones.<id>`. `proposed` marks one not yet approved;
# `enabled = false` turns one off without losing stamps already given.

# The first stamp most players get: a single boot is enough.
[[milestone]]
id = "kept_the_boot"
name = "Kept the Boot"
rule = "first_day"
fact = "boots"
at_least = 1

