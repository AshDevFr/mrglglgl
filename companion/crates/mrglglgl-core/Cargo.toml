[package]
name = "mrglglgl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Finds WoW installs and reads, archives and summarises Mrglglgl journals"
repository.workspace = true

[dependencies]
chrono = { workspace = true }
# The provider trait only; the app turns the bundled model on.
mrglglgl-llm = { workspace = true }
notify = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
image = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true, optional = true }

[features]
# TypeScript types for the app's frontend; off for everything else.
ts = ["dep:ts-rs"]

[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
