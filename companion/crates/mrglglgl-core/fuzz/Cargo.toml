[package]
name = "mrglglgl-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mrglglgl-core = { path = ".." }

# Not part of the app workspace: fuzzing needs a nightly toolchain, and stable builds of the
# workspace must not try to build it.
[workspace]
members = ["."]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false
