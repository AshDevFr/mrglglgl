[workspace]
members = [
    "crates/mrglglgl-app",
    "crates/mrglglgl-core",
    "crates/mrglglgl-llm",
]
resolver = "2"
default-members = ["crates/mrglglgl-app"]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT"
authors = ["AshDevFr"]
description = "Reads Mrglglgl addon journals and writes them up as prose"
repository = "https://github.com/AshDevFr/mrglglgl"
homepage = "https://github.com/AshDevFr/mrglglgl"

[workspace.dependencies]
# Workspace crates (one crate per concern; new domains get their own
# mrglglgl-* crate declared here and consumed with `workspace = true`)
mrglglgl-core = { path = "crates/mrglglgl-core" }
mrglglgl-llm = { path = "crates/mrglglgl-llm", default-features = false }

# Desktop shell
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-build = { version = "2.7", features = [] }
# Native folder picker for exports.
tauri-plugin-dialog = "2.8.3"
# Shows the log file in the system's file manager.
tauri-plugin-opener = "2.7"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# Remembers the window's size and place between launches.
tauri-plugin-window-state = "2"
# Scales screenshots to page width for exports; only the formats the game saves.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tga"] }
# Renders the journal website through themes players can override (Jinja-style templates).
minijinja = { version = "2.24.0", features = ["loader"] }

# TypeScript bindings for the types Tauri commands exchange. tauri-specta's
# Tauri 2 line is still a release candidate, so the stable ts-rs generates
# the types and a thin hand-written wrapper types each `invoke`.
ts-rs = "12"

# Runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"

# Local inference: llama.cpp, CPU only. Default features add OpenMP and the `common` library,
# neither needed for plain generation.
llama-cpp-2 = { version = "0.1.161", default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors and tracing
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The app's log file: rotated daily in the data folder, a week kept.
tracing-appender = "0.2.5"

# HTTP: model downloads and OpenAI-compatible endpoints. rustls avoids a system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
url = "2"

# Storage and files
rusqlite = { version = "0.41", features = ["bundled"] }
notify = "8"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
winreg = "0.56"

# Addon packages: read and verified before anything is written; deflate is all the packager uses.
zip = { version = "9.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Prompts and narrator profiles
sha2 = "0.11"
toml = "1"

# The endpoint key lives in the system keychain. On Linux the Secret Service is reached over
# pure-Rust D-Bus, so no system library is needed to build.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native-async-persistent", "tokio", "crypto-rust"] }
# Whether the game is running, and the machine's memory and free disk for the first run.
dunce = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }

# Tests
tempfile = "3"
